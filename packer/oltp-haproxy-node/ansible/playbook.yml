---
- name: Configure oltp-haproxy-node template (Phase 0.G.4)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    target_user: "{{ target_user | default('nexusadmin') }}"
    oltp_node_haproxy_version: "{{ oltp_node_haproxy_version | default('3.0') }}"

  roles:
    - nexus_identity
    - nexus_network
    - nexus_firewall
    - nexus_observability
    - oltp_firstboot
    - oltp_haproxy
