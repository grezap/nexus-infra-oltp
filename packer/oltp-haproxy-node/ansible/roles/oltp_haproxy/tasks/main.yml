---
# oltp_haproxy role -- install HAProxy {{ oltp_node_haproxy_version }} LTS
# from the haproxy.debian.net project-maintained backport repo +
# nexus-haproxy.service (DISABLED -- the terraform role-overlay renders
# haproxy.cfg + enables + starts).
#
# Why haproxy.debian.net (not Debian apt main): Debian 13's apt haproxy is
# typically 2-3 minor versions behind LTS. The project's official Debian
# repo (haproxy.debian.net, maintained by Vincent Bernat) ships the
# current LTS major + minor with security backports.

- name: Install prerequisites for haproxy.debian.net apt
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: false

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Fetch haproxy.debian.net signing key
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -s /etc/apt/keyrings/haproxy.gpg ]; then
      curl -fsSL https://haproxy.debian.net/bernat.debian.org.gpg \
        > /tmp/haproxy.gpg
      install -m 0644 -o root -g root /tmp/haproxy.gpg /etc/apt/keyrings/haproxy.gpg
      rm -f /tmp/haproxy.gpg
    fi
  args:
    creates: /etc/apt/keyrings/haproxy.gpg

# haproxy.debian.net ships per-codename + per-major repos. Pin to bookworm
# (Debian 13 trixie support typically lags). The bookworm .debs run fine
# on trixie.
- name: Write haproxy.debian.net apt source (haproxy {{ oltp_node_haproxy_version }})
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/haproxy.list
    content: |
      # Generated by oltp_haproxy Ansible role -- Phase 0.G.4.
      # haproxy.debian.net (vbernat) backport repo for HAProxy LTS.
      # Pinned to bookworm (trixie support typically lags); .debs run on trixie.
      deb [signed-by=/etc/apt/keyrings/haproxy.gpg] http://haproxy.debian.net bookworm-backports-{{ oltp_node_haproxy_version }} main
    owner: root
    group: root
    mode: '0644'

- name: Apt-get update after haproxy apt source written
  ansible.builtin.apt:
    update_cache: true

- name: Install HAProxy {{ oltp_node_haproxy_version }} + keepalived (VRRP VIP daemon)
  ansible.builtin.apt:
    name:
      - haproxy
      - socat       # admin socket access for runtime stats / dynamic reconfig
      - keepalived  # VRRP daemon for the HA-pair VIP .60 (mirrors 0.G.3 proxysql-1/2 + VIP .50 pattern)
      - iproute2    # ip(8) for VIP-bound checks in keepalived health probes
    state: present
    update_cache: false
  environment:
    DEBIAN_FRONTEND: noninteractive

# ─── Disable + mask apt-shipped haproxy.service + keepalived.service ─────
# Both apt-installed units would race our canonical nexus-* units on cold
# boot. nexus-haproxy.service reads /etc/nexus-haproxy/haproxy.cfg (not
# /etc/haproxy/haproxy.cfg) and the terraform overlay renders that. The
# keepalived overlay (role-overlay-haproxy-keepalived.tf) drops its config
# at /etc/keepalived/keepalived.conf + enables the apt-shipped keepalived.
# service AFTER config is rendered -- but at bake time we mask both to
# prevent a config-less start.
- name: Stop apt-shipped haproxy + keepalived services if running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - haproxy.service
    - keepalived.service
  failed_when: false

- name: Disable apt-shipped haproxy.service (mask -- nexus-haproxy.service is canonical)
  ansible.builtin.systemd:
    name: haproxy.service
    enabled: false
    masked: true

# keepalived.service is DISABLED but NOT MASKED -- the terraform overlay
# enables + starts it after rendering /etc/keepalived/keepalived.conf
# with per-host MASTER/BACKUP priority + unicast peer config.
- name: Disable apt-shipped keepalived.service (terraform overlay enables after render)
  ansible.builtin.systemd:
    name: keepalived.service
    enabled: false

# ─── haproxy user/group sanity ───────────────────────────────────────────
- name: Verify haproxy group exists (apt-created)
  ansible.builtin.getent:
    database: group
    key: "{{ oltp_node_haproxy_group }}"

- name: Verify haproxy user exists (apt-created)
  ansible.builtin.getent:
    database: passwd
    key: "{{ oltp_node_haproxy_user }}"

# ─── Per-node dirs ───────────────────────────────────────────────────────
- name: Create nexus-haproxy directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ oltp_node_haproxy_config_dir }}",       owner: root,                     group: "{{ oltp_node_haproxy_group }}", mode: '0750' }
    - { path: "{{ oltp_node_haproxy_config_dir }}/tls",   owner: root,                     group: "{{ oltp_node_haproxy_group }}", mode: '0750' }
    - { path: "{{ oltp_node_haproxy_log_dir }}",          owner: "{{ oltp_node_haproxy_user }}", group: "{{ oltp_node_haproxy_group }}", mode: '0750' }

# ─── nexus-haproxy.service (DISABLED at bake) ────────────────────────────
- name: Install nexus-haproxy.service systemd unit
  ansible.builtin.template:
    src: nexus-haproxy.service.j2
    dest: /etc/systemd/system/nexus-haproxy.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Ensure nexus-haproxy.service is disabled at bake
  ansible.builtin.systemd:
    name: nexus-haproxy.service
    enabled: false
    daemon_reload: true

# ─── Verify ──────────────────────────────────────────────────────────────
- name: Verify HAProxy tooling
  ansible.builtin.command: /usr/sbin/haproxy -v
  changed_when: false
  register: oltp_haproxy_verify

- name: Show installed HAProxy version
  ansible.builtin.debug:
    msg:
      - "haproxy: {{ oltp_haproxy_verify.stdout_lines[0] }}"
      - "Series:  {{ oltp_node_haproxy_version }} (from haproxy.debian.net bookworm-backports-{{ oltp_node_haproxy_version }})"
