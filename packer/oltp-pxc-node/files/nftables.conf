#!/usr/sbin/nft -f
#
# oltp-node -- nftables ruleset (Phase 0.G.1 baseline; cold-clone safety net)
#
# Builds on the deb13 baseline (deny-all-inbound, allow SSH +
# node_exporter from VMnet11) and adds the oltp-node role's cluster-
# backplane + operator-access rules.
#
# At clone time the primary NIC is `nic0` (VMnet11 service) and the
# secondary NIC is `nic1` (VMnet10 cluster backplane), set up by
# oltp-node-firstboot.sh post-clone.
#
# Kept in sync with terraform/envs/oltp/role-overlay-oltp-nftables-backplane.tf,
# which pushes its OWN inlined ruleset to each clone + `nft -f` at apply
# time. The runtime overlay is the canonical source of truth -- this baked
# baseline only matters for a clone whose Terraform apply never ran (e.g.
# manual `vmrun start` for ad-hoc testing).
#
# Per memory/feedback_cluster_template_nftables_backplane.md: the
# `iifname "nic1" ip saddr 192.168.10.0/24 accept` rule is what makes
# Redis Cluster cluster bus (16379) work; without it, ping passes but TCP
# does not.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop

        # ICMP -- let everything ping (debug-friendly in a lab)
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        # Management from the lab network only
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"

        # Phase 0.G.1 -- oltp-node role: trust the VMnet10 cluster backplane.
        # In 0.G.1 Redis Cluster bus runs on VMnet11 (cluster-announce-bus-port
        # 16379, no cluster-announce-bus-ip), but the backplane trust is
        # preserved for forward compatibility with later sub-phases that may
        # flip cluster traffic to VMnet10 (cluster-announce-bus-ip 7.2+).
        # Enumerating every port across the 5 oltp clusters (redis / mongo /
        # percona / patroni / etcd / haproxy) is fragile; the canonical
        # pattern is "the cluster backplane is trusted." nic1 only carries
        # 192.168.10.0/24 traffic; the saddr restriction prevents cross-
        # network leak via misconfigured routing.
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10)"

        # Phase 0.G.1 -- operator + app access from the build host / lab (VMnet11).
        #   6379   Redis TLS data port
        #   16379  Redis Cluster bus (full mesh; gossip + failover voting)
        # Rule present on every oltp-node regardless of role -- harmless when
        # no listener is bound (e.g. 16379 on a non-redis clone).
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport { 6379, 16379 } accept comment "Redis client + cluster bus from VMnet11"

        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
