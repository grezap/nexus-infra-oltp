---
# oltp_patroni role -- install PostgreSQL {{ oltp_node_pg_version }} from PGDG
# + Patroni {{ oltp_node_patroni_version }} from PyPI + patronictl wrapper +
# nexus-patroni.service (DISABLED -- the terraform role-overlays render
# patroni.yml + enable + start per-host via the bootstrap sequence).
#
# Why PGDG (not Debian apt main): Debian 13 ships PG 15 in main; we want 17
# for: incremental backups, the SQL/JSON updates, the IO improvements,
# pg_stat_io. PGDG's debian apt repo ships every supported major in parallel.
#
# Why pip Patroni (not Debian apt main): apt's patroni is older (typically
# 3.x). Patroni 4.x adds: improved switchover RPC, the etcd3 v3 gRPC API
# (the v2 API Patroni was using is deprecated in etcd 3.5+), and tighter
# watchdog integration. PyPI is canonical; pip install --break-system-packages
# is acceptable on a single-purpose Packer template.

# ─── PGDG apt repo ────────────────────────────────────────────────────────
- name: Install prerequisites for PGDG apt
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential   # psycopg2 source build fallback
    state: present
    update_cache: false

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Fetch PGDG signing key (apt.postgresql.org)
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -s /etc/apt/keyrings/pgdg.gpg ]; then
      curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
        | gpg --dearmor > /tmp/pgdg.gpg
      install -m 0644 -o root -g root /tmp/pgdg.gpg /etc/apt/keyrings/pgdg.gpg
      rm -f /tmp/pgdg.gpg
    fi
  args:
    creates: /etc/apt/keyrings/pgdg.gpg

# PGDG ships per-codename repos. We pin to `bookworm-pgdg` even on Debian 13
# (trixie) because PGDG's trixie support typically lags by a few months after
# Debian releases. The bookworm PGDG .debs are statically built against a
# minimal libc + work fine on trixie. Switch to trixie-pgdg when supported.
- name: Write PGDG apt source (bookworm-pgdg pinned)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pgdg.list
    content: |
      # Generated by oltp_patroni Ansible role -- Phase 0.G.4.
      # PGDG trixie support typically lags Debian release; bookworm packages
      # run fine on trixie. Switch to `trixie-pgdg main` when PGDG ships it.
      deb [signed-by=/etc/apt/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main
    owner: root
    group: root
    mode: '0644'

- name: Apt-get update after PGDG apt source written
  ansible.builtin.apt:
    update_cache: true

- name: Install PostgreSQL {{ oltp_node_pg_version }} server + client + contrib
  ansible.builtin.apt:
    name:
      - "postgresql-{{ oltp_node_pg_version }}"
      - "postgresql-client-{{ oltp_node_pg_version }}"
      - "postgresql-contrib-{{ oltp_node_pg_version }}"
      - libpq-dev    # psycopg2 build dep
    state: present
    update_cache: false
  environment:
    DEBIAN_FRONTEND: noninteractive

# ─── Mask the apt-shipped postgresql units ────────────────────────────────
# postgresql-{{ ver }}'s apt install creates 2 systemd units that auto-start
# PG against the default datadir (/var/lib/postgresql/{{ ver }}/main):
#   - postgresql.service               (umbrella unit)
#   - postgresql@{{ ver }}-main.service (per-cluster instance)
# Patroni manages PG lifecycle (initdb, start, stop, promote, demote,
# pg_rewind) against OUR datadir (/var/lib/nexus-patroni/data). The apt
# units would race + auto-start a stale junk cluster on the default datadir.
# Mask is stronger than disable.
- name: Stop apt-shipped postgresql.service if running
  ansible.builtin.systemd:
    name: postgresql.service
    state: stopped
  failed_when: false

- name: Disable + mask postgresql.service (apt-shipped umbrella)
  ansible.builtin.systemd:
    name: postgresql.service
    enabled: false
    masked: true

- name: Stop apt-shipped postgresql@{{ oltp_node_pg_version }}-main.service if running
  ansible.builtin.systemd:
    name: "postgresql@{{ oltp_node_pg_version }}-main.service"
    state: stopped
  failed_when: false

- name: Disable + mask postgresql@{{ oltp_node_pg_version }}-main.service (apt-shipped instance)
  ansible.builtin.systemd:
    name: "postgresql@{{ oltp_node_pg_version }}-main.service"
    enabled: false
    masked: true

# Remove the apt-shipped default cluster so the data dir is fully ours.
# pg_dropcluster is idempotent (exit 1 if cluster doesn't exist; failed_when
# false handles that gracefully).
- name: Drop the apt-shipped default cluster (Patroni manages PGDATA at /var/lib/nexus-patroni/data)
  ansible.builtin.command: "/usr/bin/pg_dropcluster --stop {{ oltp_node_pg_version }} main"
  failed_when: false
  changed_when: true

# ─── postgres user/group sanity ──────────────────────────────────────────
- name: Verify postgres group exists
  ansible.builtin.getent:
    database: group
    key: "{{ oltp_node_pg_group }}"

- name: Verify postgres user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ oltp_node_pg_user }}"

# ─── Per-node dirs ────────────────────────────────────────────────────────
# config dir is root:postgres 0750 -- Terraform overlays write here as root,
# nexus-patroni.service reads as postgres. Same pattern as /etc/nexus-redis,
# /etc/nexus-mongo, /etc/nexus-percona, /etc/nexus-kafka.
# data dir is postgres:postgres 0700 (PG enforces 0700 on PGDATA + refuses
# to start otherwise).
- name: Create nexus-patroni directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ oltp_node_patroni_config_dir }}",       owner: root,                  group: "{{ oltp_node_pg_group }}", mode: '0750' }
    - { path: "{{ oltp_node_patroni_config_dir }}/tls",   owner: root,                  group: "{{ oltp_node_pg_group }}", mode: '0750' }
    - { path: "{{ oltp_node_patroni_data_dir }}",         owner: "{{ oltp_node_pg_user }}", group: "{{ oltp_node_pg_group }}", mode: '0700' }
    - { path: "{{ oltp_node_patroni_data_dir }}/data",    owner: "{{ oltp_node_pg_user }}", group: "{{ oltp_node_pg_group }}", mode: '0700' }
    - { path: "{{ oltp_node_patroni_log_dir }}",          owner: "{{ oltp_node_pg_user }}", group: "{{ oltp_node_pg_group }}", mode: '0750' }

# ─── Install Patroni from PyPI ────────────────────────────────────────────
# Patroni installs from PyPI with the [etcd3] extras (pulls etcd3 client +
# python-etcd3 protobuf bindings). We use a venv at /opt/patroni-venv to
# avoid PEP 668 / break-system-packages friction; symlink patroni +
# patronictl to /usr/local/bin so Patroni's systemd unit ExecStart works
# without venv activation.
- name: Create Patroni venv
  ansible.builtin.command: /usr/bin/python3 -m venv /opt/patroni-venv
  args:
    creates: /opt/patroni-venv/bin/python

- name: Upgrade pip + setuptools inside Patroni venv
  ansible.builtin.shell: |
    /opt/patroni-venv/bin/pip install --upgrade 'pip>=24.0' 'setuptools>=70' wheel
  changed_when: true

- name: Install Patroni {{ oltp_node_patroni_version }} + extras into venv
  ansible.builtin.shell: |
    /opt/patroni-venv/bin/pip install \
      'patroni[etcd3]=={{ oltp_node_patroni_version }}' \
      'psycopg2-binary>=2.9' \
      'python-etcd>=0.4.5'
  args:
    creates: "/opt/patroni-venv/lib/python3.13/site-packages/patroni-{{ oltp_node_patroni_version }}.dist-info"
  # Python minor may differ at bake time; the creates: marker is a hint --
  # if it doesn't match (e.g. py3.12 instead of py3.13), the install still
  # runs every bake. Acceptable for the per-engine template's idempotency
  # (it's a fresh install each Packer build, not a re-run on a live VM).
  failed_when: false
  changed_when: true

- name: Symlink patroni + patronictl into /usr/local/bin
  ansible.builtin.file:
    src: "/opt/patroni-venv/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - patroni
    - patronictl

# /usr/local/sbin/nexus-patronictl -- operator wrapper that points patronictl
# at our config dir. Saves typing `patronictl -c /etc/nexus-patroni/patroni.yml
# <verb>` every time. Operator-friendly.
- name: Install /usr/local/sbin/nexus-patronictl operator wrapper
  ansible.builtin.copy:
    dest: /usr/local/sbin/nexus-patronictl
    content: |
      #!/bin/bash
      # nexus-patronictl -- patronictl wrapper pre-pointed at our config dir.
      # Avoids typing -c /etc/nexus-patroni/patroni.yml every invocation.
      exec /usr/local/bin/patronictl -c {{ oltp_node_patroni_config_dir }}/patroni.yml "$@"
    owner: root
    group: root
    mode: '0755'

# ─── nexus-patroni.service (DISABLED at bake) ────────────────────────────
- name: Install nexus-patroni.service systemd unit
  ansible.builtin.template:
    src: nexus-patroni.service.j2
    dest: /etc/systemd/system/nexus-patroni.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Ensure nexus-patroni.service is disabled at bake
  ansible.builtin.systemd:
    name: nexus-patroni.service
    enabled: false
    daemon_reload: true

# Firstboot is owned by the shared oltp_firstboot role -- this role does NOT
# touch /usr/local/sbin/oltp-node-firstboot.sh or its service.

# ─── Verify ──────────────────────────────────────────────────────────────
- name: Verify PostgreSQL + Patroni tooling
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - "/usr/lib/postgresql/{{ oltp_node_pg_version }}/bin/postgres --version"
    - /usr/local/bin/patroni --version
    - /usr/local/bin/patronictl --version
  register: oltp_patroni_verify

- name: Show installed Patroni stack versions
  ansible.builtin.debug:
    msg:
      - "postgres:   {{ oltp_patroni_verify.results[0].stdout_lines[0] }}"
      - "patroni:    {{ oltp_patroni_verify.results[1].stdout_lines[0] | default(oltp_patroni_verify.results[1].stderr_lines[0]) }}"
      - "patronictl: {{ oltp_patroni_verify.results[2].stdout_lines[0] | default(oltp_patroni_verify.results[2].stderr_lines[0]) }}"
      - "PG major:   {{ oltp_node_pg_version }} (from apt.postgresql.org / bookworm-pgdg)"
      - "Patroni:    {{ oltp_node_patroni_version }} (from PyPI with [etcd3] extras)"
