---
# oltp_mongo role -- install MongoDB from the vendor APT repo, the systemd
# unit (DISABLED -- the Terraform role-overlays render mongod.conf +
# enable nexus-mongo.service per-host). Runs after oltp_redis inside the
# oltp-node Packer template.
#
# Why MongoDB vendor APT (not Debian apt main): Debian dropped the
# mongodb-org packages over the SSPL license. The vendor APT at
# repo.mongodb.org is the only canonical source.
#
# Why we pin to the bookworm codename even on Debian 13 (trixie): MongoDB
# 8.0's APT support matrix as of the 0.G.2 ship lists debian/bookworm
# (Debian 12) as the newest supported codename. trixie support typically
# lags by 6-12 months after a Debian release. bookworm packages run fine
# on trixie because mongodb-org-server is a statically-linked binary with
# minimal libc deps; the apt repo distribution model is the only thing
# that needs the codename. If MongoDB ships a trixie repo, switch
# oltp_node_mongodb_apt_codename to "trixie" or detect via lsb_release.

# ─── MongoDB vendor APT repo ──────────────────────────────────────────────
- name: Install prerequisites for the MongoDB vendor APT repo
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: false   # oltp_redis already update_cache'd; cached is fine

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download MongoDB GPG key
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL "https://www.mongodb.org/static/pgp/server-{{ oltp_node_mongodb_version }}.asc" \
      | gpg --dearmor -o /etc/apt/keyrings/mongodb-server-{{ oltp_node_mongodb_version }}.gpg
    chmod 644 /etc/apt/keyrings/mongodb-server-{{ oltp_node_mongodb_version }}.gpg
  args:
    creates: /etc/apt/keyrings/mongodb-server-{{ oltp_node_mongodb_version }}.gpg

- name: Add MongoDB vendor APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/mongodb-org-{{ oltp_node_mongodb_version }}.list
    content: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/mongodb-server-{{ oltp_node_mongodb_version }}.gpg]
      https://repo.mongodb.org/apt/debian bookworm/mongodb-org/{{ oltp_node_mongodb_version }} main
    owner: root
    group: root
    mode: '0644'

- name: Install mongodb-org-server + mongodb-mongosh + mongodb-org-tools + mongodb-org-mongos
  ansible.builtin.apt:
    name:
      - mongodb-org-server      # mongod (data plane)
      - mongodb-mongosh         # mongosh REPL
      - mongodb-org-tools       # mongodump, mongorestore, etc.
      - mongodb-org-mongos      # mongos (query router) -- Phase 0.N sharded cluster
    state: present
    update_cache: true

# Disable apt-shipped mongos.service. There is no native unit (mongos is a
# CLI launched on demand), but if a future apt revision ships one we mask it
# so the canonical nexus-mongos.service is the only one that can bind 27017.
- name: Stop mongos.service (apt-installed) if present + running
  ansible.builtin.systemd:
    name: mongos.service
    state: stopped
  failed_when: false

- name: Disable + mask mongos.service (apt-installed) if present
  ansible.builtin.systemd:
    name: mongos.service
    enabled: false
    masked: true
  failed_when: false

# ─── Disable + mask the apt-shipped mongod.service ────────────────────────
# Debian's mongodb-org-server enables mongod.service by default. Our
# canonical unit is nexus-mongo.service which reads /etc/nexus-mongo/
# mongod.conf (NOT /etc/mongod.conf). Leaving the apt unit enabled would
# race nexus-mongo.service for port 27017 on cold boot. Mask is stronger
# than disable (survives a stray `systemctl enable mongod.service`).
- name: Stop mongod.service (apt-installed) if running
  ansible.builtin.systemd:
    name: mongod.service
    state: stopped
  failed_when: false

- name: Disable + mask mongod.service (apt-installed)
  ansible.builtin.systemd:
    name: mongod.service
    enabled: false
    masked: true

# ─── MongoDB system account (apt creates it; verify only) ────────────────
- name: Verify mongodb group exists (apt-created)
  ansible.builtin.getent:
    database: group
    key: "{{ oltp_node_mongo_group }}"

- name: Verify mongodb user exists (apt-created)
  ansible.builtin.getent:
    database: passwd
    key: "{{ oltp_node_mongo_user }}"

# ─── Per-node config + tls + data + log dirs ──────────────────────────────
# config dir is root:mongodb 0750 -- Terraform overlays write here as root,
# nexus-mongo.service reads as mongodb. Same pattern as /etc/nexus-redis.
- name: Create nexus-mongo directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ oltp_node_mongo_config_dir }}", owner: root, group: "{{ oltp_node_mongo_group }}", mode: '0750' }
    - { path: "{{ oltp_node_mongo_config_dir }}/tls", owner: root, group: "{{ oltp_node_mongo_group }}", mode: '0750' }
    - { path: "{{ oltp_node_mongo_data_dir }}", owner: "{{ oltp_node_mongo_user }}", group: "{{ oltp_node_mongo_group }}", mode: '0750' }
    - { path: "{{ oltp_node_mongo_log_dir }}", owner: "{{ oltp_node_mongo_user }}", group: "{{ oltp_node_mongo_group }}", mode: '0750' }

# ─── nexus-mongo.service (DISABLED at bake) ──────────────────────────────
- name: Install nexus-mongo.service systemd unit
  ansible.builtin.template:
    src: nexus-mongo.service.j2
    dest: /etc/systemd/system/nexus-mongo.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Ensure nexus-mongo.service is disabled at bake
  ansible.builtin.systemd:
    name: nexus-mongo.service
    enabled: false
    daemon_reload: true

# Firstboot is owned by the oltp_redis role (the firstboot script + systemd
# unit are shared across all oltp_<engine> roles -- only the IP-to-role map
# inside the script varies per sub-phase, extended by edit). This role does
# NOT touch /usr/local/sbin/oltp-node-firstboot.sh or its service.

# ─── Verify ──────────────────────────────────────────────────────────────
- name: Verify MongoDB tooling
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - mongod --version
    - mongosh --version
    - mongos --version
  register: oltp_mongo_verify

- name: Show installed MongoDB version
  ansible.builtin.debug:
    msg:
      - "mongod:  {{ oltp_mongo_verify.results[0].stdout_lines[0] }}"
      - "mongosh: {{ oltp_mongo_verify.results[1].stdout }}"
      - "mongos:  {{ oltp_mongo_verify.results[2].stdout_lines[0] }}"
      - "Vendor major: {{ oltp_node_mongodb_version }} (from repo.mongodb.org/apt/debian bookworm)"
