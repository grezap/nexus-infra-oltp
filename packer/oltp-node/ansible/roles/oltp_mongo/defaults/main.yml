---
# oltp_mongo role defaults

# MongoDB major version (X.Y) installed from the MongoDB vendor APT repo
# at https://repo.mongodb.org/apt/debian/. The repo path is keyed by
# Debian codename (bookworm, trixie, etc.) AND MongoDB major.
oltp_node_mongodb_version: "8.0"

# System account every MongoDB service runs as. The apt-installed
# mongodb-org-server package creates the mongodb user+group already; the
# role task verifies presence (idempotent no-op when apt already created
# them).
oltp_node_mongo_user: mongodb
oltp_node_mongo_group: mongodb

# Per-node dirs (config + keyFile + cert material + data + log rendered
# by Terraform role-overlay-mongo-*.tf in nexus-infra-oltp).
oltp_node_mongo_config_dir: /etc/nexus-mongo
oltp_node_mongo_data_dir: /var/lib/nexus-mongo
oltp_node_mongo_log_dir: /var/log/nexus-mongo
