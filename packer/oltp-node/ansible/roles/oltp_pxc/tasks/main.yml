---
# oltp_pxc role -- install Percona XtraDB Cluster from the Percona vendor
# APT repo, xtrabackup-80 for SST, the 2 systemd units (nexus-percona.service
# + nexus-percona-bootstrap.service, both DISABLED -- the Terraform role-
# overlays render config + enable + start per-host via the chunk 3c galera-
# cluster-bootstrap sequence). Runs after oltp_redis + oltp_mongo inside the
# oltp-node Packer template.
#
# Why Percona vendor APT (not Debian apt main): Debian 13 ships MariaDB
# as the default mysql-server, not Percona's Galera-enabled fork. Percona's
# vendor APT at repo.percona.com is canonical for PXC; the `percona-release`
# helper tool enables the right sub-repos (pxc-80 + tools-80 + ps-80).
#
# Why we pin to the bookworm codename even on Debian 13 (trixie): same
# rationale as oltp_mongo -- Percona's APT support matrix as of 0.G.3
# lists debian/bookworm as the newest supported codename; trixie typically
# lags. The .deb packages are statically linked against minimal libc; they
# run fine on trixie. If Percona ships a trixie repo, switch
# oltp_node_pxc_apt_codename to "trixie" or detect via lsb_release.

# ─── Percona vendor APT repo (via percona-release) ────────────────────────
- name: Install prerequisites for Percona vendor APT
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: false   # oltp_redis already update_cache'd; cached is fine

- name: Download Percona repo .deb (percona-release)
  ansible.builtin.get_url:
    url: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
    dest: /tmp/percona-release.deb
    mode: '0644'

# We don't actually INSTALL the .deb -- `percona-release setup pxc-80`
# (its main feature) refuses Debian 13 with "Specified repository is not
# supported for current operating system!". And on Debian 13, the .deb's
# postinst doesn't reliably land the GPG key where modern apt+sqv expects
# it. So we extract the keyring directly + write our own apt source.
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

# Extract the GPG key directly from the .deb (location varies across
# percona-release versions; common slots are /etc/apt/trusted.gpg.d/,
# /usr/share/keyrings/, /etc/apt/keyrings/, with file names
# percona-release.gpg / percona-keyring.gpg / RPM-GPG-KEY-Percona.gpg).
# `dpkg-deb -x` extracts without running postinst (which would have tried
# `percona-release setup` and exploded).
- name: Extract Percona GPG keyring from the .deb
  ansible.builtin.shell: |
    set -euo pipefail
    cd /tmp
    rm -rf percona-deb-extract
    mkdir percona-deb-extract
    dpkg-deb -x /tmp/percona-release.deb percona-deb-extract
    # Find the binary keyring (skip .asc -- needs dearmor; we want raw .gpg)
    KEY=$(find percona-deb-extract -type f \( -name "*.gpg" -o -name "*keyring*" \) | head -1)
    if [ -z "$KEY" ]; then
      # Fallback: armored .asc -> dearmor
      ASC=$(find percona-deb-extract -type f -name "*.asc" | head -1)
      if [ -n "$ASC" ]; then
        gpg --dearmor < "$ASC" > /tmp/percona.gpg
        KEY=/tmp/percona.gpg
      else
        echo "ERROR: no GPG key found in percona-release.deb" >&2
        find percona-deb-extract -type f >&2
        exit 1
      fi
    fi
    install -m 0644 -o root -g root "$KEY" /etc/apt/keyrings/percona.gpg
    rm -rf percona-deb-extract /tmp/percona.gpg
    echo "extracted GPG key to /etc/apt/keyrings/percona.gpg (source: $KEY)"
  args:
    creates: /etc/apt/keyrings/percona.gpg

# Manual apt source -- the 3 sub-repos `percona-release setup pxc-80`
# would have enabled, hardcoded to bookworm + signed-by our extracted key.
- name: Write Percona PXC apt source (manual, bypasses percona-release OS check)
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/percona-pxc-{{ oltp_node_pxc_version | replace('.', '') }}-release.list"
    content: |
      # Generated by oltp_pxc Ansible role -- Phase 0.G.3.
      # `percona-release setup pxc-{{ oltp_node_pxc_version | replace('.', '') }}` refuses Debian 13 (trixie);
      # bookworm packages run fine on trixie (statically-linked deb).
      deb [signed-by=/etc/apt/keyrings/percona.gpg] http://repo.percona.com/pxc-{{ oltp_node_pxc_version | replace('.', '') }}/apt   bookworm main
      deb [signed-by=/etc/apt/keyrings/percona.gpg] http://repo.percona.com/tools/apt     bookworm main
      deb [signed-by=/etc/apt/keyrings/percona.gpg] http://repo.percona.com/ps-{{ oltp_node_pxc_version | replace('.', '') }}/apt    bookworm main
    owner: root
    group: root
    mode: '0644'

- name: Apt-get update after Percona apt source written
  ansible.builtin.apt:
    update_cache: true

# Percona 8.0 bookworm packages depend on `libaio1` + `libldap-2.5-0` --
# both renamed in Debian 13's t64 transition (libaio1 -> libaio1t64,
# libldap-2.5-0 -> libldap-2.6-0). Names + sonames are ABI-incompatible,
# so the t64 packages don't satisfy the dep automatically. Fix: add
# bookworm as a narrow fallback apt source + pin so ONLY those two lib
# names come from bookworm. Everything else still resolves from trixie.
- name: Add Debian bookworm fallback apt source (libaio1 + libldap-2.5-0 only)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/bookworm-percona-deps.list
    content: |
      # Generated by oltp_pxc Ansible role -- Phase 0.G.3.
      # Bookworm fallback for the 2 lib names Percona 8.0 needs but trixie
      # renamed in the t64 transition. Pinned to priority 100 (lower than
      # default 500) so only the explicit `apt install libaio1
      # libldap-2.5-0` below pulls from here; everything else stays trixie.
      deb http://deb.debian.org/debian bookworm main
    owner: root
    group: root
    mode: '0644'

- name: Pin bookworm apt repo to low priority (only the 2 explicit libs pull from it)
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/bookworm-percona-deps.pref
    content: |
      # Generated by oltp_pxc Ansible role -- Phase 0.G.3.
      # Default-deny bookworm packages, only allow the 2 Percona deps.
      Package: *
      Pin: release n=bookworm
      Pin-Priority: 100

      Package: libaio1 libldap-2.5-0
      Pin: release n=bookworm
      Pin-Priority: 990
    owner: root
    group: root
    mode: '0644'

- name: Apt-get update after bookworm fallback source added
  ansible.builtin.apt:
    update_cache: true

- name: Install Percona-required libs from bookworm (libaio1 + libldap-2.5-0)
  ansible.builtin.apt:
    name:
      - libaio1
      - libldap-2.5-0
    state: present
    update_cache: false
    default_release: bookworm

- name: Install Percona XtraDB Cluster server + client + xtrabackup
  ansible.builtin.apt:
    name:
      - percona-xtradb-cluster-server
      - percona-xtradb-cluster-client
      - percona-xtrabackup-80
      - socat       # xtrabackup-v2 SST transport (donor + joiner side)
      - rsync       # fallback SST method, useful for diagnostics
      - qpress      # xtrabackup parallel compression (xtrabackup-80 dep)
    state: present
    update_cache: false
  environment:
    DEBIAN_FRONTEND: noninteractive
    # PXC apt install refuses to start mysqld if datadir is non-empty; we
    # haven't touched /var/lib/mysql so this is fine, but defensively set
    # the env that suppresses the interactive password prompt regardless.
    PERCONA_TELEMETRY_DISABLE: "1"

# ─── Disable + mask the apt-shipped mysql.service ─────────────────────────
# Percona's apt install enables mysql.service by default (auto-bootstraps a
# size-1 cluster on first start, binds 3306). Our canonical units are
# nexus-percona.service + nexus-percona-bootstrap.service which read
# /etc/nexus-percona/my.cnf (NOT /etc/mysql/my.cnf). Leaving the apt unit
# enabled would race ours on cold boot + auto-bootstrap a junk cluster.
# Mask is stronger than disable.
- name: Stop mysql.service (apt-installed) if running
  ansible.builtin.systemd:
    name: mysql.service
    state: stopped
  failed_when: false

- name: Disable + mask mysql.service (apt-installed)
  ansible.builtin.systemd:
    name: mysql.service
    enabled: false
    masked: true

- name: Stop mysql@.service template if any instance running
  ansible.builtin.systemd:
    name: mysql@bootstrap.service
    state: stopped
  failed_when: false

- name: Disable + mask mysql@bootstrap.service template (apt-installed)
  ansible.builtin.systemd:
    name: mysql@bootstrap.service
    enabled: false
    masked: true

# ─── Disable AppArmor profile for mysqld ─────────────────────────────────
# Debian 13 + percona-xtradb-cluster-server ships /etc/apparmor.d/
# usr.sbin.mysqld which restricts mysqld writes to /var/lib/mysql/. Our
# datadir is /var/lib/nexus-percona/ -- AppArmor denies the write,
# Galera fails with `Could not open state file for writing: '/var/lib/
# nexus-percona//grastate.dat': Permission denied`. The fix is to
# disable the profile (link into /etc/apparmor.d/disable/ + reload).
# Adding a local override in /etc/apparmor.d/local/usr.sbin.mysqld would
# also work but disable is simpler + matches what other Galera-on-custom-
# datadir Debian deployments do.
- name: Ensure /etc/apparmor.d/disable exists
  ansible.builtin.file:
    path: /etc/apparmor.d/disable
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable AppArmor profile for mysqld (datadir is /var/lib/nexus-percona, not /var/lib/mysql)
  ansible.builtin.file:
    src: /etc/apparmor.d/usr.sbin.mysqld
    dest: /etc/apparmor.d/disable/usr.sbin.mysqld
    state: link
    owner: root
    group: root

- name: Unload mysqld AppArmor profile (apparmor_parser -R)
  ansible.builtin.command: apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
  failed_when: false   # profile may not be loaded yet on first run; harmless
  changed_when: true

# ─── mysql system account (apt creates it; verify only) ──────────────────
- name: Verify mysql group exists (apt-created)
  ansible.builtin.getent:
    database: group
    key: "{{ oltp_node_pxc_group }}"

- name: Verify mysql user exists (apt-created)
  ansible.builtin.getent:
    database: passwd
    key: "{{ oltp_node_pxc_user }}"

# ─── Per-node config + tls + data + log dirs ──────────────────────────────
# config dir is root:mysql 0750 -- Terraform overlays write here as root,
# nexus-percona.service reads as mysql. Same pattern as /etc/nexus-redis,
# /etc/nexus-mongo, /etc/nexus-kafka.
- name: Create nexus-percona directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ oltp_node_pxc_config_dir }}", owner: root, group: "{{ oltp_node_pxc_group }}", mode: '0750' }
    - { path: "{{ oltp_node_pxc_config_dir }}/tls", owner: root, group: "{{ oltp_node_pxc_group }}", mode: '0750' }
    - { path: "{{ oltp_node_pxc_data_dir }}", owner: "{{ oltp_node_pxc_user }}", group: "{{ oltp_node_pxc_group }}", mode: '0750' }
    - { path: "{{ oltp_node_pxc_log_dir }}", owner: "{{ oltp_node_pxc_user }}", group: "{{ oltp_node_pxc_group }}", mode: '0750' }

# ─── Install /usr/local/sbin/nexus-pxc-mysql wrapper ────────────────────
# Auth-mode-aware mysql wrapper used by chunk 3c galera-bootstrap + all
# verification probes. Handles BOTH:
#   - Fresh-init: root@localhost is passwordless/auth_socket (sudo mysql
#     works without -p).
#   - Post-bootstrap: root@localhost has the KV password set by step 4
#     ALTER USER (sudo mysql -p<password> required).
# Without this wrapper, the chunk 3c probes (which use sudo mysql with no
# -p) silently retry-forever after root password is set -- the 2>/dev/null
# suppresses the Access denied error, the probe just returns empty.
# Caught at 0.G.3 ratification 2026-05-18. Lives under /usr/local/sbin/
# (root-only writable) since it reads the 0400 root:mysql password file.
- name: Install /usr/local/sbin/nexus-pxc-mysql auth-mode-aware wrapper
  ansible.builtin.copy:
    dest: /usr/local/sbin/nexus-pxc-mysql
    content: |
      #!/bin/bash
      # nexus-pxc-mysql -- auth-mode-aware mysql wrapper for chunk 3c
      # galera-bootstrap + verification probes. Tries password-from-
      # KV-file first; falls back to passwordless on auth failure.
      # Handles BOTH:
      #   - Fresh-init datadir: root is passwordless (file exists from
      #     Vault Agent render but doesn't match anything yet -- step 4
      #     ALTER USER hasn't run).
      #   - Post-step-4: root has the KV password set; passwordless fails.
      # See oltp_pxc role tasks for full context (0.G.3 ratification 2026-05-18).
      set -e
      SOCK=/var/run/nexus-percona/mysqld.sock
      PWD_FILE=/etc/nexus-percona/root-password
      if [ -s "$PWD_FILE" ]; then
        PWD="$(cat "$PWD_FILE")"
        # Try password-protected: if it works, use it.
        if env MYSQL_PWD="$PWD" mysql -u root --socket="$SOCK" -BNe 'SELECT 1' >/dev/null 2>&1; then
          exec env MYSQL_PWD="$PWD" mysql -u root --socket="$SOCK" "$@"
        fi
      fi
      # Fall back to passwordless (fresh-init case).
      exec mysql -u root --socket="$SOCK" "$@"
    owner: root
    group: root
    mode: '0755'

# ─── Initialize the Percona datadir (one-shot at template bake) ──────────
# Percona apt's postinst initializes /var/lib/mysql/ (the apt-default
# datadir), NOT our custom /var/lib/nexus-percona/. Without initialization,
# nexus-percona.service + nexus-percona-bootstrap.service crash on first
# start with `[MY-011011] Failed to find valid data directory`. The
# `creates:` arg makes this idempotent -- skip if mysql.* system tables
# already exist. The init runs WITHOUT --defaults-file (no my.cnf yet at
# bake time; that's rendered by chunk 3b TF overlay per-host) -- straight
# `--initialize-insecure --datadir=...` writes the system tables fresh.
# Cloned VMs share these initial system tables; pxc-node-1 takes them
# into the Galera-new-cluster bootstrap, pxc-node-2/3 join via xtrabackup
# SST and get pxc-node-1's data on top.
- name: Initialize the Percona datadir (one-shot; --initialize-insecure)
  ansible.builtin.command: >
    /usr/sbin/mysqld
    --initialize-insecure
    --datadir={{ oltp_node_pxc_data_dir }}
    --user={{ oltp_node_pxc_user }}
  args:
    # general_log.CSM is reliably created by --initialize-insecure as part
    # of the mysql.* system tables. Its presence == datadir is initialized.
    creates: "{{ oltp_node_pxc_data_dir }}/mysql/general_log.CSM"

# ─── nexus-percona.service + nexus-percona-bootstrap.service (DISABLED) ──
- name: Install nexus-percona.service systemd unit
  ansible.builtin.template:
    src: nexus-percona.service.j2
    dest: /etc/systemd/system/nexus-percona.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Install nexus-percona-bootstrap.service systemd unit
  ansible.builtin.template:
    src: nexus-percona-bootstrap.service.j2
    dest: /etc/systemd/system/nexus-percona-bootstrap.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Ensure nexus-percona.service + nexus-percona-bootstrap.service are disabled at bake
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    daemon_reload: true
  loop:
    - nexus-percona.service
    - nexus-percona-bootstrap.service

# Firstboot is owned by the oltp_redis role (the firstboot script + systemd
# unit are shared across all oltp_<engine> roles -- only the IP-to-role map
# inside the script varies per sub-phase). This role does NOT touch
# /usr/local/sbin/oltp-node-firstboot.sh or its service.

# ─── Verify ──────────────────────────────────────────────────────────────
- name: Verify Percona tooling
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - mysqld --version
    - xtrabackup --version
  register: oltp_pxc_verify

- name: Show installed Percona version
  ansible.builtin.debug:
    msg:
      - "mysqld:     {{ oltp_pxc_verify.results[0].stdout_lines[0] }}"
      - "xtrabackup: {{ oltp_pxc_verify.results[1].stderr_lines[0] | default(oltp_pxc_verify.results[1].stdout_lines[0]) }}"
      - "Vendor major: {{ oltp_node_pxc_version }} (from repo.percona.com/apt pxc-{{ oltp_node_pxc_version | replace('.', '') }})"
