---
# oltp_proxysql role defaults

# ProxySQL major series. Installed via the ProxySQL vendor APT repo at
# repo.proxysql.com. v2 (proxysql2 package) is current; v1 is legacy.
oltp_node_proxysql_version: "2.6"

# System account ProxySQL runs as. The apt-installed proxysql2 package
# creates the proxysql user+group; the role task verifies presence.
oltp_node_proxysql_user: proxysql
oltp_node_proxysql_group: proxysql

# Per-node dirs. /etc/proxysql.cnf is the canonical bootstrap config; runtime
# state lives in the embedded SQLite at /var/lib/proxysql/proxysql.db.
oltp_node_proxysql_runtime_dir: /var/lib/proxysql
oltp_node_proxysql_log_dir: /var/log/proxysql
