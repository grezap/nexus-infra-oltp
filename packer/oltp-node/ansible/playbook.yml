---
# oltp-node -- Ansible playbook (local, run by Packer ansible-local provisioner)
#
# Same shape as nexus-infra-kafka/packer/kafka-node/ansible/playbook.yml.
# Four shared nexus_* roles run first, then oltp_redis installs apt-shipped
# Redis 7.x, the firstboot script + systemd units (all role units delivered
# DISABLED -- the Terraform role-overlays render config + enable per-host).
#
# Order: nexus_identity (sshd) -> nexus_network (NIC rename) -> nexus_firewall
# (rules need nic0/nic1 to exist) -> nexus_observability (node_exporter
# binding uses the renamed NIC) -> oltp_redis (assumes the baseline is up).
#
# Later 0.G.* sub-phases add sibling roles (oltp_mongo / oltp_percona /
# oltp_patroni) that install their engine alongside Redis on the SAME
# template -- firstboot's IP-to-role map picks which engine each clone runs.

- name: Configure oltp-node template (Phase 0.G.1+)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    target_user: "{{ target_user | default('nexusadmin') }}"
    # Pass-through from Packer extra-vars to role-internal names.
    oltp_node_redis_version: "{{ oltp_node_redis_version | default('apt-default') }}"

  roles:
    - nexus_identity
    - nexus_network
    - nexus_firewall
    - nexus_observability
    - oltp_redis
